trigger: 
- develop 

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'Install dependencies'

- script: npm test
  displayName: 'Run tests'

- script: |
    npm run build
  displayName: 'Build'

